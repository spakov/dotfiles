[Claude]
image=ghcr.io/ublue-os/ubuntu-toolbox
nvidia=true
additional_packages="curl gnupg"
init_hooks="sudo curl -fsSLo /usr/share/keyrings/claude-desktop-archive-keyring.asc https://downloads.claude.ai/claude-desktop/key.asc"
init_hooks="gpg --show-keys /usr/share/keyrings/claude-desktop-archive-keyring.asc"
init_hooks="echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main" | sudo tee /etc/apt/sources.list.d/claude-desktop.list"
init_hooks="sudo apt update && sudo apt-get -y install claude-desktop"
